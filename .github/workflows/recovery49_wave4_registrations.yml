name: Wave 4 search ten address-first YEAR2 FSA farms against NAIP
on:
  push:
    paths:
      - 'scripts/recovery49_wave4_registrations.py'
      - '.github/workflows/recovery49_wave4_registrations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless pymupdf requests
      - name: Match ten further source FSA maps to public NAIP and Esri geographic imagery
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/recovery49_wave4_registrations.py | tee /tmp/recovery49_wave4.log
      - name: Publish image-registration diagnostics without fabricating field polygons
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add analysis/recovery49_20261111/wave4/
          if ! git diff --cached --quiet; then
            git commit -m "Audit fourth ten-farmer NAIP registration wave with retained mismatch flags"
            git push origin HEAD:main
          fi

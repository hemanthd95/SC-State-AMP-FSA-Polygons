name: QA digitized Orangeburg farm field six candidate
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orangeburg_farm1778_candidate_field6.py'
      - '.github/workflows/orangeburg_farm1778_candidate_field6.yml'
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless shapely pyproj
      - run: python scripts/orangeburg_farm1778_candidate_field6.py
      - name: Preserve geospatial field trace and visual provenance as candidate, not accepted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_farm1778_field6_candidate*
          if ! git diff --cached --quiet; then
            git commit -m "Digitize Orangeburg Farm1778 Tract1334 Field6 with printed-acreage QA"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orangeburg-Farm-1778-Field6-QA
          path: analysis/orangeburg_farm1778_field6_candidate*
          retention-days: 30

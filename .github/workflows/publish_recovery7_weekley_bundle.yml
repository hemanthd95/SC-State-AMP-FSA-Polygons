name: Seven-farmer Weekley-format recovery GIS bundle
on:
  push:
    paths:
      - 'scripts/publish_recovery7_weekley_bundle.py'
      - '.github/workflows/publish_recovery7_weekley_bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' pyshp shapely pyproj pillow reportlab pymupdf requests
      - name: Produce verified farmer shapefiles and both maps; mark unregistered files
        run: |
          set -o pipefail
          AMP_FARM_WORKERS=4 python scripts/publish_recovery7_weekley_bundle.py | tee analysis/recovery7_20261110/packaging_run.log
      - name: Publish seven-farmer ZIP to current private repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add deliverables/recovery_seven_weekley_20261110/README_START_HERE.txt || true
          git add deliverables/recovery_seven_weekley_20261110/Seven_Farmer_Recovery_Index_QA.csv || true
          git add deliverables/recovery_seven_weekley_20261110/BUILD_SUMMARY.json || true
          git add analysis/recovery7_20261110/packaging_run.log || true
          if [ -f deliverables/SC_AMP_Seven_Farmer_Recovery_20261110.zip ]; then
           bytes=$(stat -c%s deliverables/SC_AMP_Seven_Farmer_Recovery_20261110.zip)
           if [ "$bytes" -lt 95000000 ]; then
             git add deliverables/SC_AMP_Seven_Farmer_Recovery_20261110.zip
           else
             echo "::error::Recovery bundle exceeds GitHub size limit"; exit 1
           fi
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish seven-farmer Weekley-format GIS deliverables and unresolved-source QA"
            git push origin HEAD:main
          fi

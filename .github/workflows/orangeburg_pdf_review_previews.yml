name: Prepare Orangeburg FSA scanned map visual review previews
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orangeburg_pdf_review_previews.py'
      - '.github/workflows/orangeburg_pdf_review_previews.yml'
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf pillow
      - run: python scripts/orangeburg_pdf_review_previews.py
      - name: Save source-map previews with clear unregistered warnings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_fsa_review_previews/
          if ! git diff --cached --quiet; then
            git commit -m "Generate Orangeburg FSA source-map preview sheets without claiming registration"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orangeburg-FSA-Review-Previews
          path: analysis/orangeburg_fsa_review_previews/
          retention-days: 30

name: Trace Jasper exact FSA field one in tract 5515
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orangeburg_trace_jasper_5515_field1.py'
      - '.github/workflows/orangeburg_trace_jasper_5515_field1.yml'
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless shapely pyproj
      - run: python scripts/orangeburg_trace_jasper_5515_field1.py
      - name: Commit exact field QA images and candidate GIS geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_farm13653_tract5515_field1_*
          if ! git diff --cached --quiet; then
            git commit -m "Trace Jasper FSA tract5515 Field1 with independent area and county QA"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jasper-5515-Field1-QA
          path: analysis/orangeburg_farm13653_tract5515_field1_*
          retention-days: 30

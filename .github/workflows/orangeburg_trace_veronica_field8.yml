name: Trace actual Veronica 45514 Field8 FSA aerial polygon for QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orangeburg_trace_veronica_field8.py'
      - '.github/workflows/orangeburg_trace_veronica_field8.yml'
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless pyproj shapely
      - name: Digitize FSA polygon and validate geographic area against printed acres
        id: qa
        continue-on-error: true
        run: python scripts/orangeburg_trace_veronica_field8.py > analysis/orangeburg_trace_veronica_field8_run.log 2>&1
      - name: Save visual QA photographs and preliminary GeoJSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_trace_veronica_field8_run.log
          git add analysis/orangeburg_veronica_field8_candidate*.jpg || true
          git add analysis/orangeburg_veronica_field8_candidate*.json || true
          git add analysis/orangeburg_veronica_field8_candidate*.geojson || true
          if ! git diff --cached --quiet; then
            git commit -m "Inspect exact Veronica FSA 4.79-acre field trace over independent aerial imagery"
            git pull --rebase origin main
            git push
          fi
      - if: steps.qa.outcome == 'failure'
        run: exit 1

name: Prepare verified Orangeburg county outline and coordinate screen
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orangeburg_spatial_baseline.py'
      - '.github/workflows/orangeburg_spatial_baseline.yml'
permissions:
  contents: write
jobs:
  county:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyshp shapely
      - run: python scripts/orangeburg_spatial_baseline.py
      - name: Save official Orangeburg county boundary and preliminary GPS screening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geojson/orangeburg_county_boundary.geojson analysis/orangeburg_coordinate_screening.json
          if ! git diff --cached --quiet; then
            git commit -m "Import Census Orangeburg county outline and screen approximate producer hints"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orangeburg-County-Outline
          path: |
            geojson/orangeburg_county_boundary.geojson
            analysis/orangeburg_coordinate_screening.json
          if-no-files-found: warn
          retention-days: 30

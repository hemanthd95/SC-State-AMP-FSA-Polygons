name: Enlarge Montez Farm1033 source FSA field4 for trace QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/orangeburg_montez_field4_crop.yml'
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless
      - run: |
          python -c "import cv2;i=cv2.imread('analysis/orangeburg_montez_farm1033_match_source.jpg');assert i is not None;c=i[60:360,180:430];cv2.imwrite('analysis/orangeburg_montez_farm1033_field4_source_zoom.jpg',cv2.resize(c,None,fx=4,fy=4,interpolation=cv2.INTER_CUBIC))"
      - name: Save exact source field geometry inspection image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_montez_farm1033_field4_source_zoom.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Enlarge Montez FSA Tract3879 Field4 white boundary for digitization"
            git pull --rebase origin main
            git push
          fi

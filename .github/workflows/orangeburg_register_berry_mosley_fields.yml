name: Register Orangeburg Berry and Mosley individual fields
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orangeburg_register_berry_mosley_fields.py'
      - '.github/workflows/orangeburg_register_berry_mosley_fields.yml'
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless pymupdf requests
      - run: python scripts/orangeburg_register_berry_mosley_fields.py
      - name: Save field-specific FSA aerial alignment QC
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_farm14048_* analysis/orangeburg_farm11782_*
          if ! git diff --cached --quiet; then
            git commit -m "Register Berry and Mosley exact FSA field-source images for polygon tracing"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orangeburg-Berry-Mosley-Registration-QC
          path: |
            analysis/orangeburg_farm14048_*
            analysis/orangeburg_farm11782_*
          retention-days: 30

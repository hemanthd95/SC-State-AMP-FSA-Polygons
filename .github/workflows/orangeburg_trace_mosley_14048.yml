name: Trace Tarsha Mosley FSA 0.89-acre field
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orangeburg_trace_mosley_14048.py'
      - '.github/workflows/orangeburg_trace_mosley_14048.yml'
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless shapely pyproj
      - run: python scripts/orangeburg_trace_mosley_14048.py
      - name: Save source and satellite matched field overlays
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_farm14048_field1_candidate*
          if ! git diff --cached --quiet; then
            git commit -m "QA Tarsha Mosley field1 against source map and published acreage"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orangeburg-Mosley-FSA-Field1
          path: analysis/orangeburg_farm14048_field1_candidate*
          retention-days: 30

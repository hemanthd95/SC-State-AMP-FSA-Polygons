name: Inventory Orangeburg AMP farms and georeferencing readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/orangeburg_source_inventory.yml'
      - 'scripts/orangeburg_source_inventory.py'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Load existing private FSA maps and Orangeburg workbook
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbook and PDF inspection dependencies
        run: python -m pip install --upgrade openpyxl pymupdf
      - name: Audit source farm IDs, tracts, selected fields and PDF spatial references
        run: python scripts/orangeburg_source_inventory.py
      - name: Preserve inventory privately for review and polygon registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_source_inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit Orangeburg AMP farms, FSA PDFs and spatial-reference readiness"
            git push
          fi
      - name: Upload audit as private workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orangeburg-FSA-Source-Inventory
          path: analysis/orangeburg_source_inventory.json
          if-no-files-found: warn
          retention-days: 30

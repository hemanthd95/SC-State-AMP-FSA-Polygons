name: Build South Carolina AMP county atlases

on:
  push:
    paths:
      - "scripts/build_amp_county_atlases.py"
      - "data/farm_overview_points_reported.geojson"
      - "data/farm_inventory_county_spreadsheets.json"
      - "data/farm_source_pdf_crosswalk.json"
      - "geojson/**"
      - ".github/workflows/build_atlases.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf-atlases:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out private FSA geometry repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial and PDF packages
        run: python -m pip install --upgrade numpy matplotlib pillow requests pyshp shapely pymupdf

      - name: Generate satellite and topographic PDF atlases
        run: python scripts/build_amp_county_atlases.py

      - name: Upload PDF atlas ZIP as downloadable artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SC_AMP_County_Atlas_PDFs
          path: |
            outputs/county_pdfs/*.pdf
            outputs/qa/*
            outputs/SC_AMP_County_Atlas_PDFs.zip
          retention-days: 90
          if-no-files-found: warn

      - name: Publish generated PDFs to this private repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/county_pdfs outputs/qa
          if [ -f outputs/SC_AMP_County_Atlas_PDFs.zip ] && [ $(stat -c%s outputs/SC_AMP_County_Atlas_PDFs.zip) -lt 95000000 ]; then
            git add outputs/SC_AMP_County_Atlas_PDFs.zip
          else
            echo "Atlas ZIP too large for Git; PDFs remain individually available and ZIP is in Actions artifacts."
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Build county satellite and topo atlases [skip atlas]"
            git push
          fi

name: Produce detailed QA crop of Tywone FSA field boundaries
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/orangeburg_tywone_field_crop_qa.yml'
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless
      - name: Enlarge source FSA field boundary for exact manual digitization
        run: |
          python -c "import cv2; i=cv2.imread('analysis/orangeburg_farm3873_complete_source.jpg'); assert i is not None; z=i[205:335,305:490]; assert z.size; cv2.imwrite('analysis/orangeburg_farm3873_FSA_fields1and4_zoom.jpg',cv2.resize(z,None,fx=5,fy=5,interpolation=cv2.INTER_CUBIC))"
      - name: Save detailed private reference crop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_farm3873_FSA_fields1and4_zoom.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Magnify exact FSA outlines for Tywone field QA"
            git pull --rebase origin main
            git push
          fi

name: Refine Tywone farm requested fields with full NAIP coverage
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orangeburg_refine_tywone_target.py'
      - '.github/workflows/orangeburg_refine_tywone_target.yml'
permissions:
  contents: write
jobs:
  georeference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless pymupdf requests
      - name: Check full FSA Field1 and Field4 photo against independent NAIP
        id: match
        continue-on-error: true
        run: python scripts/orangeburg_refine_tywone_target.py > analysis/orangeburg_refine_tywone_target_run.log 2>&1
      - name: Preserve stable registration and independent QA imagery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_refine_tywone_target_run.log
          git add analysis/orangeburg_farm3873_complete_*.jpg || true
          git add analysis/orangeburg_farm3873_complete_field_registration.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Verify Tywone Hillard FSA Field1 and Field4 against unoccluded NAIP tile"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orangeburg-Farm3873-Target-Registration
          path: |
            analysis/orangeburg_farm3873_complete*
            analysis/orangeburg_refine_tywone_target_run.log
          retention-days: 30
      - if: steps.match.outcome == 'failure'
        run: exit 1

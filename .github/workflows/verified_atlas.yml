name: Publish truly registered AMP FSA satellite and topography atlas subset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlases:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read the private original FSA source maps and county spreadsheets
        uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF GIS and cartographic dependencies
        run: |
          python -m pip install --upgrade 'numpy<2.5' shapely pyproj pillow pymupdf reportlab requests openpyxl
      - name: Digitize native FSA vector boundaries and render actual geographic basemaps
        run: |
          python scripts/build_verified_atlases.py
      - name: Preserve downloadable atlas PDFs and GIS vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCSU-AMP-Verified-County-Atlases
          path: verified_atlas_deliverables/
          if-no-files-found: warn
          retention-days: 30

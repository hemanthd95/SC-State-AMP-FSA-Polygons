name: Verify Orangeburg Hillard requested FSA map page registrations
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orangeburg_target_page_registrations.py'
      - '.github/workflows/orangeburg_target_page_registrations.yml'
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless pymupdf requests
      - name: Match only FSA photo pages containing requested Tract/Fields
        id: match
        continue-on-error: true
        run: python scripts/orangeburg_target_page_registrations.py > analysis/orangeburg_target_page_registrations_run.log 2>&1
      - name: Commit geographic registration diagnostics and review images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_target_page_registrations_run.log
          git add analysis/orangeburg_target_page_registrations.json || true
          git add analysis/orangeburg_target_p1_farm*.jpg || true
          if ! git diff --cached --quiet; then
            git commit -m "Check actual Farm1033 and Farm3873 FSA photo-map geometry"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orangeburg-Target-FSA-Page-QA
          path: |
            analysis/orangeburg_target_page_registrations.json
            analysis/orangeburg_target_page_registrations_run.log
            analysis/orangeburg_target_p1_farm*.jpg
          retention-days: 30
      - if: steps.match.outcome == 'failure'
        run: exit 1

name: Search for actual Allendale FSA fields in satellite imagery

on:
  push:
    paths:
      - "scripts/allendale_grid_search.py"
      - ".github/workflows/allendale_grid_search.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install satellite matching dependencies
        run: python -m pip install --upgrade "numpy<2.5" pillow requests opencv-python-headless pymupdf
      - name: Search actual NAIP imagery for FSA source photographs
        run: python scripts/allendale_grid_search.py
      - name: Preserve spatial-search diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allendale-source-to-naip-search
          path: registration_trials/allendale_grid_search
          if-no-files-found: warn
      - name: Save only successful image-match diagnostics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registration_trials/allendale_grid_search
          if ! git diff --cached --quiet; then
            git commit -m "Record actual aerial-image search results for Allendale field georeferencing"
            git push
          fi

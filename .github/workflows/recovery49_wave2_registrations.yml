name: Wave 2 register ten straightforward one-page farmer FSA maps
on:
  push:
    paths:
      - 'scripts/recovery49_wave2_registrations.py'
      - '.github/workflows/recovery49_wave2_registrations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless pymupdf requests
      - name: Match 10 FSA raster maps to NAIP around geocoded Excel farm addresses
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/recovery49_wave2_registrations.py | tee /tmp/recovery49_wave2.log
      - name: Commit only source photo matching QA and warranted aerial overlays
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add analysis/recovery49_20261111/wave2/
          if ! git diff --cached --quiet; then
            git commit -m "Document address-first NAIP registration evidence for ten priority AMP farmers"
            git push origin HEAD:main
          fi

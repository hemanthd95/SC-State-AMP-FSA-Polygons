name: Batch2 search Joe Hilliard correct Farm13859 scanned source
on:
  push:
    paths:
      - 'scripts/recovery49_batch2_joe_enrolled_farm_search.py'
      - '.github/workflows/recovery49_batch2_joe_enrolled_farm_search.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless pymupdf requests
      - name: Match source Farm13859 scan directly against public NAIP and Esri images
        run: |
          set -o pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/recovery49_batch2_joe_enrolled_farm_search.py | tee /tmp/joe_enrolled_search.log
      - name: Publish image matching QA without falsely closing missing Field20
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add analysis/recovery49_20261111/batch2/joe_enrolled_farm13859_registration/
          if ! git diff --cached --quiet; then
            git commit -m "Locate correct Joe Hilliard Farm13859 source, preserve missing enrolled Field20"
            git push origin HEAD:main
          fi

name: Render QA images from Orangeburg working atlas PDFs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/qa_orangeburg_atlas_previews.py'
      - '.github/workflows/qa_orangeburg_atlas_previews.yml'
      - 'orangeburg_working_atlas/preview_manifest.json'
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf pillow numpy
      - run: python scripts/qa_orangeburg_atlas_previews.py
      - name: Preserve PDF page QA images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_pdf_* analysis/orangeburg_working_atlas_render_check.json
          if ! git diff --cached --quiet; then
            git commit -m "QA inspect all Orangeburg satellite/topo PDF pages and save cover/detail page previews"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orangeburg-Atlas-Page-Rendering-QA
          path: |
            analysis/orangeburg_pdf_*
            analysis/orangeburg_working_atlas_render_check.json
          retention-days: 30

name: Align Darlington FSA field maps to satellite imagery
on:
  push:
    paths:
      - 'scripts/darlington_registration_batch.py'
      - '.github/workflows/darlington_registration_trial.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Retrieve exact FSA source pages
        run: |
          git lfs pull --include="*Mava Jackson_FSA map*"
          git lfs pull --include="*Garrett Patterson_FSA_MAP.pdf"
          python -c "from pathlib import Path; p=Path('source-data/OneDrive_2026-11-03/SC State_AMP_FSA MAP/Mava Jackson_FSA map, (dragged).pdf'); assert p.read_bytes()[:4]==b'%PDF'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imagery matching requirements
        run: python -m pip install pymupdf numpy opencv-python-headless requests
      - name: Find map-to-satellite matches near reported locations
        run: |
          python scripts/darlington_registration_batch.py > analysis/darlington_registration_trial.log 2>&1
          tail -30 analysis/darlington_registration_trial.log
      - name: Preserve only diagnostic files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/darlington_*.json analysis/darlington_*.jpg analysis/darlington_registration_trial.log || true
          if ! git diff --cached --quiet; then
            git commit -m "Record Darlington FSA image registration candidates"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Darlington-FSA-registration-diagnostics
          path: |
            analysis/darlington_registration_findings.json
            analysis/darlington_*.jpg
            analysis/darlington_registration_trial.log
          retention-days: 14

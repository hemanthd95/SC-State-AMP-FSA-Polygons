name: Audit alternate scanned Veronica FSA PDF for Orangeburg tract identifiers
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orangeburg_audit_veronica_alt21.py'
      - '.github/workflows/orangeburg_audit_veronica_alt21.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf
      - name: Install OCR utility for scanned FSA page identifiers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - name: OCR only Farm and Tract IDs for 21 source pages
        id: scan
        continue-on-error: true
        run: python scripts/orangeburg_audit_veronica_alt21.py > analysis/orangeburg_audit_veronica_alt21_run.log 2>&1
      - name: Preserve source provenance metadata and only relevant page previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_audit_veronica_alt21_run.log
          git add analysis/orangeburg_veronica_alt21_page_identifier_audit.json || true
          git add analysis/orangeburg_veronica_alt21_match_page*.jpg || true
          if ! git diff --cached --quiet; then
            git commit -m "Classify alternate Veronica PDF pages by printed FSA Farm/Tract"
            git pull --rebase origin main
            git push
          fi
      - if: steps.scan.outcome == 'failure'
        run: exit 1

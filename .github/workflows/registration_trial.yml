name: Diagnose alignment of Florence Marion paper FSA maps to NAIP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/registration_trial.yml'
      - 'scripts/trial_register_florence_marion.py'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-registration dependencies
        run: python -m pip install 'numpy<2.5' opencv-python-headless pymupdf pillow requests
      - name: Test authentic source aerials against USGS NAIP imagery
        run: python scripts/trial_register_florence_marion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FSA-Florence-Marion-Registration-QA
          path: registration_trials/florence_marion/
          retention-days: 30

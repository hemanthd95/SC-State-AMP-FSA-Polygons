name: Inspect Veronica Hodges additional FSA pages for exact farm field IDs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/orangeburg_veronica_remaining_pages_qa.yml'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf pillow
      - name: Render the unreviewed original FSA source map page and adjacent printed ID text
        run: |
          python -c "import fitz;from pathlib import Path;p=Path('source-data/OneDrive_2026-11-03/SC State_AMP_FSA MAP/Veronica Hodges FSA.pdf');d=fitz.open(p);print('PDF PAGES',len(d));assert len(d)>=3;d[2].get_pixmap(matrix=fitz.Matrix(1.45,1.45),alpha=False).save('analysis/orangeburg_veronica_fsa_p3_full.jpg',jpg_quality=88);print('Page3 preview saved')"
      - name: Keep new source review preview within private repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_veronica_fsa_p3_full.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Review third Veronica Hodges scanned FSA map page"
            git pull --rebase origin main
            git push
          fi

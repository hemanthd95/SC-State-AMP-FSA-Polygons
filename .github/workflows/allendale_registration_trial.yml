name: Diagnostic registration of Allendale scanned FSA map outlines

on:
  push:
    paths:
      - "scripts/trial_register_allendale.py"
      - ".github/workflows/allendale_registration_trial.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out original scanned FSA maps
        uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image registration dependencies
        run: python -m pip install --upgrade "numpy<2.5" pillow requests opencv-python-headless pymupdf
      - name: Locate FSA aerial photographs in NAIP satellite imagery
        run: python scripts/trial_register_allendale.py
      - name: Save diagnostic satellite imagery and registration metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allendale-image-registration-trial
          path: registration_trials/allendale
          if-no-files-found: warn
      - name: Publish readable QA previews to private repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registration_trials/allendale
          if ! git diff --cached --quiet; then
            git commit -m "Record Allendale FSA-image matching trial results"
            git push
          fi

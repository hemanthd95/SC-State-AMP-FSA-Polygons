name: Register Veronica Hodges exact Field8 on original FSA aerial imagery
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orangeburg_register_veronica_45514_field8.py'
      - '.github/workflows/orangeburg_register_veronica_field8.yml'
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.5' opencv-python-headless pymupdf requests
      - name: Match the true FSA Farm13709 Tract45514 Field8 to public NAIP
        id: run
        continue-on-error: true
        run: python scripts/orangeburg_register_veronica_45514_field8.py > analysis/orangeburg_veronica_field8_register_run.log 2>&1
      - name: Save registration candidates without promoting unverified fields
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/orangeburg_veronica_field8_register_run.log
          git add analysis/orangeburg_veronica_45514_field8_georegistration.json || true
          git add analysis/orangeburg_veronica_field8_*.jpg || true
          if ! git diff --cached --quiet; then
            git commit -m "Test field-exact Veronica 45514 Field8 against NAIP imagery"
            git pull --rebase origin main
            git push
          fi
      - if: steps.run.outcome == 'failure'
        run: exit 1
